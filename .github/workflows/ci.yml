# Build and test on Windows for every push to master and every pull request (P00-04).
# Produces diagnostics only. Nothing here is a release artifact, and nothing is signed or trusted.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Build and test (windows-2025, x64)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # Actions pinned by full commit SHA (tag in comment). Verify before bumping.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Show toolchain
        run: dotnet --info

      - name: Restore (locked)
        run: dotnet restore DynamicIsland.sln --locked-mode

      - name: Build (Release, warnings as errors)
        run: dotnet build DynamicIsland.sln -c Release --no-restore

      # Includes the WindowsSmoke test that launches DynamicIsland.exe on the runner's desktop session.
      - name: Test
        run: >-
          dotnet test --solution DynamicIsland.sln -c Release --no-build
          --results-directory "${{ github.workspace }}/TestResults"
          --report-xunit-trx

      - name: Upload test results (diagnostics only)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
